name: Probar APIs de vuelos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-flights.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: adsb.lol (aviones cerca de Barajas)
        run: |
          curl -sS -m 30 -A "RadarVuelos-test" -w "\nHTTP %{http_code} %{size_download}B %{content_type}\n" \
            "https://api.adsb.lol/v2/point/40.47/-3.56/15" -o adsb.json || true
          python3 - <<'PY'
          import json
          d = json.load(open("adsb.json"))
          print("claves:", list(d.keys()))
          ac = d.get("ac", [])
          print("aviones:", len(ac), "bytes/avión ~", len(json.dumps(ac)) // max(1, len(ac)))
          for a in ac[:3]:
              print(json.dumps(a, ensure_ascii=False))
          PY
      - name: adsb.lol rutas (routeset)
        run: |
          CS=$(python3 -c 'import json; ac=[a for a in json.load(open("adsb.json")).get("ac",[]) if a.get("flight","").strip()]; print(ac[0]["flight"].strip() if ac else "IBE3456")')
          echo "callsign: $CS"
          curl -sS -m 30 -A "RadarVuelos-test" -H "Content-Type: application/json" \
            -d "{\"planes\":[{\"callsign\":\"$CS\",\"lat\":40.47,\"lng\":-3.56}]}" \
            -w "\nHTTP %{http_code} %{content_type}\n" https://api.adsb.lol/api/0/routeset | head -c 2500
      - name: airplanes.live
        run: |
          curl -sS -m 30 -A "RadarVuelos-test" -w "\nHTTP %{http_code} %{size_download}B\n" \
            "https://api.airplanes.live/v2/point/40.47/-3.56/15" -o al.json || true
          head -c 600 al.json; echo
      - name: OpenSky (anónimo)
        run: |
          curl -sS -m 30 -w "\nHTTP %{http_code} %{size_download}B\n" \
            "https://opensky-network.org/api/states/all?lamin=40.3&lomin=-3.8&lamax=40.6&lomax=-3.3" | head -c 800
