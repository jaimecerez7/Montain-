name: Compilar apps Garmin

on:
  push:
    paths:
      - "HorizonteCimas/**"
      - "RadarVuelos/**"
      - "Esferas/**"
      - ".github/workflows/build-garmin.yml"
  workflow_dispatch:

permissions:
  contents: write   # para publicar los archivos en la página de descarga (release "beta")

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [HorizonteCimas, RadarVuelos, Esferas]
    env:
      APP_DIR: ${{ matrix.app }}
      JAVA_TOOL_OPTIONS: -Xmx6g
      # HorizonteCimas: sin comprobación de tipos global (el comprobador agota la memoria).
      MC_FLAGS: ${{ matrix.app == 'HorizonteCimas' && '--typecheck 0' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validador Python
        if: hashFiles(format('{0}/tools/validate_project.py', matrix.app)) != ''
        run: python3 -I "$APP_DIR/tools/validate_project.py"

      - name: Comprobar secretos
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Faltan los secretos GARMIN_USERNAME y GARMIN_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Instalar connect-iq-sdk-manager
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh \
            | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Aceptar licencia del SDK, iniciar sesión y descargar SDK y relojes
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          set -o pipefail
          connect-iq-sdk-manager agreement view > agreement.txt 2>&1 || true
          tail -n 20 agreement.txt
          HASH=$(grep -oE '(agreement|acceptance)-hash[= ]+[A-Za-z0-9]+' agreement.txt | head -n1 | grep -oE '[A-Za-z0-9]+$' || true)
          if [ -n "$HASH" ]; then
            connect-iq-sdk-manager agreement accept --agreement-hash="$HASH"
          else
            connect-iq-sdk-manager agreement accept
          fi
          # Recortar espacios y saltos de línea que se cuelan al pegar desde el móvil.
          U=$(printf '%s' "$GARMIN_USERNAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          P=$(printf '%s' "$GARMIN_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "Usuario: ${#U} caracteres, contiene @: $(case "$U" in *@*) echo sí;; *) echo no;; esac). Contraseña: ${#P} caracteres."
          UL=$(printf '%s' "$U" | tr '[:upper:]' '[:lower:]')
          if ! GARMIN_USERNAME="$U" GARMIN_PASSWORD="$P" connect-iq-sdk-manager login -L debug > login.log 2>&1 \
             && ! { [ "$UL" != "$U" ] && echo "Reintentando con el correo en minúsculas" \
                    && GARMIN_USERNAME="$UL" GARMIN_PASSWORD="$P" connect-iq-sdk-manager login -L debug >> login.log 2>&1; }; then
            # Mostrar el diagnóstico sin el usuario ni la contraseña.
            U="$U" P="$P" python3 -c 'import os,sys; t=open("login.log").read(); [t:=t.replace(v,"[oculto]") for v in (os.environ["U"],os.environ["P"]) if v]; sys.stdout.write(t[-4000:])'
            echo "::error::Garmin rechazó el inicio de sesión. Revisa usuario/contraseña y la verificación en dos pasos."
            exit 1
          fi
          connect-iq-sdk-manager sdk set '^9.0.0' || connect-iq-sdk-manager sdk set '^8.0.0'
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"
          connect-iq-sdk-manager device download --manifest="$APP_DIR/manifest.xml" --include-fonts \
            || connect-iq-sdk-manager device download --manifest="$APP_DIR/manifest.xml"

      - name: Clave de desarrollador
        env:
          DEVELOPER_KEY_B64: ${{ secrets.DEVELOPER_KEY_B64 }}
        run: |
          if [ -n "$DEVELOPER_KEY_B64" ]; then
            echo "$DEVELOPER_KEY_B64" | base64 -d > developer_key.der
          else
            echo "::warning::Sin secreto DEVELOPER_KEY_B64: se usa una clave temporal. Sirve para probar, pero las actualizaciones en la tienda necesitan siempre la misma clave."
            openssl genrsa -out key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt
            rm key.pem
          fi

      - name: Compilar pruebas (fr165)
        run: |
          mkdir -p build
          monkeyc $MC_FLAGS -f "$APP_DIR/monkey.jungle" -y developer_key.der -d fr165 -w -t -o build/tests-fr165.prg

      - name: Pruebas en el simulador (sin red, base offline)
        if: matrix.app == 'HorizonteCimas'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # El simulador de Linux necesita libwebkit2gtk-4.0, que solo existe hasta Ubuntu 22.04:
          # se ejecuta en un contenedor 22.04 con el SDK y los relojes ya descargados.
          SDK_BIN=$(dirname "$(command -v monkeyc)")
          docker run --rm -e HOME=/home/runner -v "$HOME/.Garmin:/home/runner/.Garmin" -v "$PWD:/w" -w /w ubuntu:22.04 bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq xvfb xauth openjdk-17-jre-headless libwebkit2gtk-4.0-37 \
              libusb-1.0-0 libsecret-1-0 libsm6 libgtk-3-0 >/dev/null 2>&1
            xvfb-run -a bash -c '\"$SDK_BIN/simulator\" > sim.log 2>&1 & sleep 25; timeout 300 \"$SDK_BIN/monkeydo\" build/tests-fr165.prg fr165 -t > tests.log 2>&1; echo salida=\$? >> tests.log'
          " || true
          echo "----- resultados -----"; tail -80 tests.log || true
          echo "----- simulador -----"; tail -20 sim.log || true
          grep -q "PASSED" tests.log && ! grep -qE "FAILED|ERROR" tests.log

      - name: Compilar para Forerunner 165 y 165 Music (.prg para USB)
        run: |
          monkeyc $MC_FLAGS -f "$APP_DIR/monkey.jungle" -y developer_key.der -d fr165 -w -r -o build/$APP_DIR-fr165.prg
          monkeyc $MC_FLAGS -f "$APP_DIR/monkey.jungle" -y developer_key.der -d fr165m -w -r -o build/$APP_DIR-fr165m.prg

      - name: Exportar paquete para la tienda (.iq)
        run: monkeyc $MC_FLAGS -f "$APP_DIR/monkey.jungle" -y developer_key.der -e -w -r -o build/$APP_DIR.iq

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: |
            build/${{ matrix.app }}.iq
            build/${{ matrix.app }}-fr165.prg
            build/${{ matrix.app }}-fr165m.prg
          if-no-files-found: error

      - name: Publicar en la página de descarga (release "beta")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view beta >/dev/null 2>&1 || \
            gh release create beta --target "$GITHUB_SHA" --prerelease --title "Versión beta" \
              --notes "Archivos más recientes. Esferas.iq, HorizonteCimas.iq y RadarVuelos.iq se suben como Beta App en apps.garmin.com/developer; los .prg son para instalar por USB."
          gh release upload beta "build/$APP_DIR.iq" "build/$APP_DIR-fr165.prg" "build/$APP_DIR-fr165m.prg" --clobber
