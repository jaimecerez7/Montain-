<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Jost; src: url("../../tools/fonts/Jost.ttf"); font-weight: 100 900; }
body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c"></canvas>
<script>
// Prototipo de las esferas: mismas primitivas y coordenadas que source/Themes.mc (diseño a 390 px).
const S = 390;
const F = {
  time:  { size: 124, weight: 250, track: 0 },
  timem: { size: 88,  weight: 280, track: 0 },
  data:  { size: 28,  weight: 340, track: 1 },
  label: { size: 19,  weight: 460, track: 5 },
  small: { size: 21,  weight: 380, track: 1 },
  mini:  { size: 13,  weight: 520, track: 3 },
};
let dc, k = 1;
const P = v => Math.round(v * k);
const IMG = {};
const GLYPH_STYLES = ['cv', 'ca', 'bl', 're', 'co'];
window.loadArt = () => Promise.all([
  ...['bg_cinta_verde','bg_cinta_ambar','bg_bloques','bg_reticula','bg_collage','bg_collage2','bg_collage3','grid','sun',
      'bg_cielo_noche','bg_cielo_alba','bg_cielo_dia','bg_cielo_dorada','bg_cielo_ocaso',
      ...[...Array(8).keys()].map(i => 'moon' + i)].map(n => [n, '../../resources/paint/' + n + '.png']),
  ...GLYPH_STYLES.flatMap(g => [...Array(11).keys()].map(i => ['g' + g + i, '../../resources/glyphs/g' + g + i + '.png']))
].map(([n, src]) => new Promise(ok => { const im = new Image(); im.onload = () => { IMG[n] = im; ok(); }; im.src = src; })));
// Hora con cifras pintadas: cada cifra trae PAD px de margen a cada lado.
const PAD = 6;
const BOUNCE = [-3, 4, 0, -4, 3];   // collage: las cifras saltan sobre la línea
function glyphTime(cx, top, t, style, track, bounce = false){
  const gs = [...t].map(ch => IMG['g' + style + (ch === ':' ? 10 : +ch)]), pad = P(PAD);
  let w = -P(track); for (const g of gs) w += g.width - 2 * pad + P(track);
  let x = cx - w / 2 - pad;
  gs.forEach((g, i) => { dc.drawImage(g, x, top - pad + (bounce ? P(BOUNCE[(i + 5 - gs.length) % 5]) : 0)); x += g.width - 2 * pad + P(track); });
}

function font(f){ return `${f.weight} ${P(f.size)}px Jost`; }
function textW(t, f){ dc.font = font(f); return dc.measureText(t).width + P(f.track) * Math.max(0, t.length - 1); }
function text(x, y, t, f, col, align = 'c'){
  dc.font = font(f); dc.fillStyle = col; dc.textBaseline = 'alphabetic'; dc.textAlign = 'left';
  const cap = P(f.size) * 0.70, w = textW(t, f);
  let sx = align === 'c' ? x - w / 2 : (align === 'r' ? x - w : x);
  for (const ch of t) { dc.fillText(ch, sx, y + cap); sx += dc.measureText(ch).width + P(f.track); }
  return w;
}
function rect(x, y, w, h, col){ dc.fillStyle = col; dc.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, col){ dc.fillStyle = col; dc.beginPath(); dc.roundRect(x, y, w, h, r); dc.fill(); }
function poly(pts, col){ dc.fillStyle = col; dc.beginPath(); dc.moveTo(...pts[0]); for (const p of pts.slice(1)) dc.lineTo(...p); dc.closePath(); dc.fill(); }
function circle(x, y, r, col){ dc.fillStyle = col; dc.beginPath(); dc.arc(x, y, r, 0, 7); dc.fill(); }
function ring(x, y, r, col){ dc.strokeStyle = col; dc.lineWidth = Math.max(1, P(2)); dc.beginPath(); dc.arc(x, y, r, 0, 7); dc.stroke(); }
function line(x1, y1, x2, y2, col, lw = 2){ dc.strokeStyle = col; dc.lineWidth = Math.max(1, P(lw)); dc.lineCap = 'round'; dc.beginPath(); dc.moveTo(x1, y1); dc.lineTo(x2, y2); dc.stroke(); }
function art(n){ dc.drawImage(IMG['bg_' + n], 0, 0, S*k, S*k); }

// ---- Iconos (igual que Draw.mc) ----
function icon(kind, x, y, s, col, bg){
  const h = s / 2;
  if (kind === 'sunrise' || kind === 'sunset'){
    const cx = x + h, cy = y + s * 0.70;
    line(x, cy, x + s, cy, col);
    dc.strokeStyle = col; dc.lineWidth = Math.max(1, P(2)); dc.beginPath(); dc.arc(cx, cy, s * 0.26, Math.PI, 0); dc.stroke();
    for (const a of [30, 60, 90, 120, 150]){ const r = a * Math.PI / 180;
      line(cx + Math.cos(r)*s*0.38, cy - Math.sin(r)*s*0.38, cx + Math.cos(r)*s*0.5, cy - Math.sin(r)*s*0.5, col); }
    const ay = y + s * (kind === 'sunrise' ? 0.92 : 0.84), d = s * 0.06 * (kind === 'sunrise' ? -1 : 1), dx = s * 0.12;
    line(cx - dx, ay - d, cx, ay + d, col); line(cx + dx, ay - d, cx, ay + d, col); return;
  }
  if (kind === 'drop'){ x += s / 6; y += s / 8; s *= 0.7; const cx = x + s / 2, r = s * 0.27;
    poly([[cx, y + s*0.08], [cx + r, y + s*0.58], [cx - r, y + s*0.58]], col); circle(cx, y + s*0.62, r, col); return; }
  if (kind === 'steps'){ dc.fillStyle = col;
    dc.beginPath(); dc.ellipse(x + s*0.30, y + s*0.40, s*0.13, s*0.22, 0, 0, 7); dc.fill(); circle(x + s*0.30, y + s*0.76, s*0.08, col);
    dc.beginPath(); dc.ellipse(x + s*0.70, y + s*0.30, s*0.13, s*0.22, 0, 0, 7); dc.fill(); circle(x + s*0.70, y + s*0.66, s*0.08, col); return; }
  if (kind === 'battery'){ // cuerpo + polo + nivel
    const bw = s, bh = s * 0.5, by = y + s * 0.28;
    rrect(x, by, bw * 0.9, bh, s*0.08, col); rrect(x + P(2), by + P(2), bw * 0.9 - P(4), bh - P(4), s*0.05, bg);
    rect(x + bw * 0.9, by + bh * 0.3, bw * 0.1, bh * 0.4, col);
    rect(x + P(3.5), by + P(3.5), (bw * 0.9 - P(7)) * window.__batt, bh - P(7), col); return; }
  if (kind === 'sun' || kind === 'partly'){
    const sun = kind === 'sun', cx = x + s*(sun ? 0.5 : 0.64), cy = y + s*(sun ? 0.5 : 0.34), r = s*(sun ? 0.2 : 0.15);
    ring(cx, cy, r, col);
    for (let i = 0; i < 8; i++){ const a = i*Math.PI/4; line(cx + Math.cos(a)*r*1.55, cy + Math.sin(a)*r*1.55, cx + Math.cos(a)*r*2.1, cy + Math.sin(a)*r*2.1, col); }
    if (sun) return;
  }
  const by = (kind === 'rain' || kind === 'snow') ? y + s*0.60 : y + s*0.74, w2 = Math.max(1, P(2));
  for (const pass of [0, 1]) { const c = pass ? bg : col, ins = pass ? w2 : 0;
    for (const q of [[0.30,-0.14,0.17],[0.55,-0.22,0.22],[0.76,-0.12,0.14]]) circle(x + s*q[0], by + s*q[1], s*q[2] - ins, c);
    const lx = x + s*0.13 + ins, rx = x + s*0.90 - ins, top = by - s*0.16;
    rrect(lx, top + ins, rx - lx, by - top - 2*ins + (pass ? 0 : 2), s*0.12, c); }
  if (kind === 'rain') for (const fx of [0.34, 0.54, 0.74]) line(x + s*fx, by + s*0.14, x + s*(fx-0.07), by + s*0.32, col);
  if (kind === 'snow') for (const fx of [0.34, 0.54, 0.74]) circle(x + s*(fx-0.03), by + s*0.24, s*0.05 + 1, col);
}

const fmtSteps = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');

// Fila de complicaciones: [icono, texto] centrados como un bloque, separados por aire.
function row(cx, y, items, col, iconCol, bg, ic = 24, f = F.data){
  const gap = P(f === F.data ? 7 : 5), sep = P(f === F.data ? 22 : 14), s = P(ic);
  let w = -sep; for (const it of items) w += s + gap + textW(it[1], f) + sep;
  let x = cx - w / 2;
  const dy = f === F.data ? P(2) : P(3) - (s - P(f.size * 0.7)) / 2;
  for (const it of items){ icon(it[0], x, y - dy, s, iconCol, bg); x += s + gap; x += text(x, y, it[1], f, col, 'l') + sep; }
}
function sunItem(d){ return d.nextSun === 'sunrise' ? ['sunrise', d.sunrise] : ['sunset', d.sunset]; }

// =================== CINTA ===================
function cinta(d, verde){
  art(verde ? 'cinta_verde' : 'cinta_ambar');
  const ink = verde ? '#1E2620' : '#2A1C11', soft = verde ? '#5E665E' : '#86735F', bg = verde ? '#D4CFC3' : '#EEEAE3';
  text(P(195), P(42), d.date, F.label, soft);
  row(P(195), P(70), [[d.cond, d.temp + '°'], ['steps', fmtSteps(d.steps)], ['battery', d.battery + '%']], ink, soft, bg, 20);
  glyphTime(P(195), P(110), d.time, verde ? 'cv' : 'ca', 2);
}

// =================== BLOQUES ===================
function bloques(d){
  art('bloques');
  // Cada bloque es un dato, escrito en un tono derivado de su propio color.
  text(P(72), P(88), d.date.split(' ')[0], F.small, '#5E201C');                        // salmón: fecha
  text(P(72), P(114), d.date.split(' ').slice(1).join(' '), F.mini, '#7E3329');
  row(P(190), P(86), [[d.cond, d.temp + '°']], '#F3D2C2', '#F3D2C2', '#7B2A2C', 20, F.small);  // burdeos: tiempo
  text(P(190), P(114), 'LLUVIA ' + d.precip + '%', F.mini, '#D69A8A');
  const mp = IMG['moon' + d.moonIdx];                                                  // sangre de buey: luna
  dc.drawImage(mp, P(290) - mp.width / 2, P(96) - mp.height / 2);
  text(P(308), P(86), Math.round(d.moonIllum * 100) + '%', F.small, '#E9BFB4', 'l');
  text(P(312), P(114), 'LUNA', F.mini, '#B87A72');
  icon('steps', P(60), P(176), P(22), '#6A2E22');                                      // melocotón: pasos
  text(P(70), P(208), fmtSteps(d.steps), F.data, '#4A1F17');
  text(P(70), P(240), 'PASOS', F.mini, '#8E4C3A');
  glyphTime(P(252), P(184), d.time, 'bl', 3);                                          // grafito: hora
  row(P(80), P(300), [['battery', d.battery + '%']], '#CFC5B5', '#CFC5B5', '#151513', 14, F.small);   // negro: batería
  row(P(250), P(300), [['sunrise', d.sunrise], ['sunset', d.sunset]], '#F6DDC8', '#F6DDC8', '#A9471B', 14, F.small);
}

// =================== RETÍCULA ===================
function reticula(d){
  art('reticula');
  const ink = '#1C1A17', soft = '#6B655C', paper = '#EDE9E1';
  text(P(195), P(30), d.date, F.label, ink);
  glyphTime(P(195), P(50), d.time, 're', 6);
  const s = sunItem(d);
  row(P(195), P(132), [[d.cond, d.temp + '°'], ['battery', d.battery + '%'], s], soft, soft, paper, 20);
  // Retícula = pasos: cada casilla es el 1 % del objetivo.
  const n = Math.min(100, Math.floor(d.steps / d.goal * 100)), g = IMG.grid;
  const gx = P(105), gy = P(160), pitch = 18 * k, rows = Math.floor(n / 10), rem = n % 10;
  dc.save(); dc.beginPath();
  dc.rect(gx, gy, g.width, rows * pitch); dc.rect(gx, gy + rows * pitch, rem * pitch, pitch);
  dc.clip(); dc.drawImage(g, gx, gy); dc.restore();
  text(P(195), P(346), fmtSteps(d.steps) + ' PASOS', F.label, ink);
}

// =================== COLLAGE ===================
function collage(d){
  art(['collage', 'collage2', 'collage3'][d.variant || 0]);                             // un collage distinto cada día
  const ink = '#1C1A17';
  // cinta de la fecha: fecha · batería
  const dw = textW(d.date, F.label), bw2 = P(14) + P(5) + textW(d.battery + '%', F.small), gapD = P(16);
  const dx0 = P(195) - (dw + gapD + bw2) / 2;
  text(dx0, P(64), d.date, F.label, ink, 'l');
  row(dx0 + dw + gapD + bw2 / 2, P(64), [['battery', d.battery + '%']], '#5A4E40', '#5A4E40', '#EFE6CC', 14, F.small);
  glyphTime(P(195), P(104), d.time, 'co', -2, true);                                   // papeles recortados que saltan
  // círculo azafrán: tiempo
  row(P(98), P(250), [[d.cond, d.temp + '°']], ink, ink, '#E8B227', 22);
  row(P(98), P(282), [['drop', d.precip + '%']], '#4A3810', '#4A3810', '#E8B227', 14, F.small);
  // tira blanca: pasos y su progreso
  icon('steps', P(186), P(240), P(18), '#5A4E40');
  text(P(195), P(260), fmtSteps(d.steps), F.data, ink);
  const bx = P(160), bw = P(70), by = P(288), f = Math.min(1, d.steps / d.goal);
  rect(bx, by, bw, Math.max(1, P(2.5)), '#D9CEB8'); rect(bx, by, bw * f, Math.max(1, P(2.5)), '#D23A22');
  // círculo azul noche: luna
  const mp = IMG['moon' + d.moonIdx];
  dc.drawImage(mp, P(292) - mp.width / 2, P(256) - mp.height / 2);
  text(P(292), P(280), Math.round(d.moonIllum * 100) + '%', F.small, '#EDE6D6');
  // cinta negra: amanecer y atardecer
  row(P(195), P(320), [['sunrise', d.sunrise], ['sunset', d.sunset]], '#F3EEE4', '#E8B227', '#151413', 14, F.small);
}

// =================== CIELO PINTADO ===================
// El cielo cambia con la altura real del sol; el sol recorre su arco; la luna muestra su fase.
function skyState(d){
  const e = d.sunNow, morning = d.nowH < (d.riseH + d.setH) / 2;
  if (e < -8) return 'noche';
  if (e >= 12) return 'dia';
  if (morning) return 'alba';
  return e >= -1 ? 'dorada' : 'ocaso';
}
function cielo(d){
  const st = d.state || skyState(d);
  art('cielo_' + st);
  const cream = '#FBF4E6', soft = '#E6DACA';
  text(P(195), P(28), d.date, F.label, soft);
  text(P(195), P(50), d.time, F.time, cream);
  // Arco del sol: recorrido punteado del día y el sol en su posición real.
  const xs = P(44), xe = P(346), yh = P(232), H = 92 * k, peak = Math.max(1, d.peak);
  const X = f => xs + (xe - xs) * f;
  for (let f = 0; f <= 1.0001; f += 1 / 34) {
    const y = yh - Math.sin(Math.PI * f) * H;
    circle(X(f), y, Math.max(1, P(1.2)), 'rgba(251,244,230,0.55)');
  }
  if (d.sunNow > -1) {
    const f = (d.nowH - d.riseH) / (d.setH - d.riseH);
    if (f > -0.02 && f < 1.02) {
      dc.save(); dc.beginPath(); dc.rect(0, 0, S*k, P(226)); dc.clip();
      const sp = IMG.sun; dc.drawImage(sp, X(f) - sp.width / 2, yh - Math.max(0, d.sunNow) / peak * H - sp.height / 2);
      dc.restore();
    }
  }
  // Luna con su fase real
  const mi = d.moonIdx, mp = IMG['moon' + mi];
  dc.drawImage(mp, P(84) - mp.width / 2, P(176) - mp.height / 2);
  text(P(102), P(170), Math.round(d.moonIllum * 100) + '%', F.label, cream, 'l');
  // Amanecer y atardecer en los extremos del arco
  row(P(70), P(240), [['sunrise', d.sunrise]], cream, soft, '#000', 16);
  row(P(320), P(240), [['sunset', d.sunset]], cream, soft, '#000', 16);
  // Datos sobre la montaña cercana
  row(P(195), P(298), [[d.cond, d.temp + '°'], ['drop', d.precip + '%']], cream, soft, '#1C2433', 22);
  row(P(195), P(332), [['steps', fmtSteps(d.steps)], ['battery', d.battery + '%']], cream, soft, '#1C2433', 20);
}

function aod(d){
  rect(0, 0, S*k, S*k, '#000');
  text(P(195), P(120), d.time, F.time, '#9A9A9A');
  text(P(195), P(240), d.date, F.label, '#6A6A6A');
}

window.render = (theme, d, size = 390) => {
  const cv = document.getElementById('c'); cv.width = cv.height = size; k = size / S;
  dc = cv.getContext('2d'); window.__batt = d.battery / 100;
  ({ cinta_verde: d => cinta(d, true), cinta_ambar: d => cinta(d, false), bloques, reticula, collage, aod, cielo,
     cielo_noche: d => cielo({...d, state: 'noche'}), cielo_alba: d => cielo({...d, state: 'alba'}),
     cielo_dia: d => cielo({...d, state: 'dia'}), cielo_dorada: d => cielo({...d, state: 'dorada'}),
     cielo_ocaso: d => cielo({...d, state: 'ocaso'}), collage2: collage, collage3: collage })[theme](d);
  dc.globalCompositeOperation = 'destination-in'; dc.beginPath(); dc.arc(size/2, size/2, size/2, 0, 7); dc.fill();
  dc.globalCompositeOperation = 'source-over';
};
</script></body></html>
