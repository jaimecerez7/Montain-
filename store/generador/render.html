<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Réplica del dibujo de HorizonteCimasView.mc (mismas proporciones y colores Garmin).
const C = {sky:'#07131E', panel:'#0D202A', ice:'#D9EFF6', muted:'#A4BDCC', grid:'#355367', accent:'#FFD17A'};
const SLOPE=0.4, COLS=44, LAYERS=[[20000,'#102633','#356074'],[8000,'#173E4B','#528B9C'],[0,'#225663','#80BBC7']];
const FOV = 60, VEXAG = 4, MAX_LABELS = 5, HIDDEN_PENALTY = 4;
const XTINY = '22px "Liberation Sans", sans-serif', TINY = 'bold 28px "Liberation Sans", sans-serif';
const FH_XTINY = 25, FH_TINY = 31;

function norm(a){ while(a<0)a+=360; while(a>=360)a-=360; return a; }
function diff(a,b){ let d=a-b; while(d>180)d-=360; while(d<-180)d+=360; return d; }
function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }

function drawScene(s){
  const cv = document.getElementById('c'); const w = 390, h = 390;
  cv.width = w; cv.height = h; const dc = cv.getContext('2d');
  dc.textBaseline = 'top'; dc.textAlign = 'center';
  const tw = (t,f) => { dc.font=f; return dc.measureText(t).width; };
  const fit = (t,f,width) => { if (tw(t,f)<=width) return t; let n=t.length; while(n>0 && tw(t.substring(0,n)+'…',f)>width) n--; return n? t.substring(0,n)+'…' : ''; };
  const text = (x,y,f,col,t) => { dc.font=f; dc.fillStyle=col; dc.fillText(t,x,y); };
  const line = (x1,y1,x2,y2,col) => { dc.strokeStyle=col; dc.lineWidth=2; dc.beginPath(); dc.moveTo(x1,y1); dc.lineTo(x2,y2); dc.stroke(); };
  const tri = (pts,col,fill) => { dc.beginPath(); dc.moveTo(...pts[0]); dc.lineTo(...pts[1]); dc.lineTo(...pts[2]); dc.closePath();
    if (fill){ dc.fillStyle=col; dc.fill(); } else { dc.strokeStyle=col; dc.lineWidth=2; dc.stroke(); } };

  const usable = (top, height = FH_XTINY) => {
    const r = w/2, dy = Math.max(Math.abs(top-h/2), Math.abs(top+height-h/2));
    return 1.8 * Math.sqrt(Math.max(0, r*r-dy*dy));
  };
  const cx = w/2, hd = s.heading, ppd = w*0.74/FOV;
  const footY = Math.trunc(h*0.93)-FH_XTINY;
  const infoY = footY-FH_XTINY-FH_TINY-6, horizonY = infoY-8;
  const tapeY = Math.trunc(h*0.30), firstLabelY = tapeY+10;
  let crestY = firstLabelY+FH_XTINY*2+10;
  const rowCount = crestY+12 < horizonY ? 2 : 1;
  if (rowCount===1) crestY-=FH_XTINY+3;
  const angleToY = (ea) => {
    const px = ea*ppd*VEXAG, range = Math.max(1, px>=0 ? horizonY-crestY : 3);
    return Math.trunc(horizonY-range*px/Math.sqrt(range*range+px*px));
  };

  dc.fillStyle = C.sky; dc.fillRect(0,0,w,h);
  const headingY = tapeY-FH_XTINY-FH_TINY-10;
  text(cx,headingY,TINY,C.ice,
    s.mode==='SIN BRÚJULA' ? '—' : String(Math.trunc(hd)).padStart(3,'0')+'°');
  text(cx,headingY+FH_TINY,XTINY,C.muted,s.mode);
  const edge = Math.trunc(FOV/2*ppd);
  line(cx-edge,tapeY,cx+edge,tapeY,C.grid);
  for (let a=Math.ceil((hd-FOV/2)/5)*5; a<=hd+FOV/2; a+=5) {
    const x=cx+Math.trunc(diff(a,hd)*ppd), dir=Math.trunc(norm(a)), major=dir%45===0;
    line(x,tapeY-(major?8:4),x,tapeY,major?C.muted:C.grid);
    const labelY=tapeY-8-FH_XTINY;
    if (major && Math.abs(x-cx)>w*0.20 && Math.abs(x-cx)+FH_XTINY<usable(labelY)/2) {
      text(x,labelY,XTINY,C.muted,['N','NE','E','SE','S','SO','O','NO'][dir/45]);
    }
  }
  tri([[cx,tapeY+6],[cx-4,tapeY-1],[cx+4,tapeY-1]],C.accent,true);
  line(w/12,horizonY,w-w/12,horizonY,C.grid);
  dc.fillStyle=C.panel; dc.fillRect(0,infoY-3,w,h-infoY+3);
  line(w/7,infoY-3,w-w/7,infoY-3,C.grid);

  let selectedOccluded = false;
  if (s.status || !s.peaks?.some(p=>Math.abs(diff(p.b,hd))<=FOV/2)){
    const y = Math.trunc(h*0.47);
    text(cx,y,XTINY,C.ice,fit(s.status || 'Sin cimas hacia aquí',XTINY,usable(y)));
  } else {
    const visible=[], terrain=[]; let sel=null, best=0;
    for (const p of s.peaks){
      const dx = diff(p.b,hd); if (Math.abs(dx)<=FOV/2+15) terrain.push([dx,p.ea,p.d]); if (dx<-FOV/2||dx>FOV/2) continue;
      const item=[dx, p.occ? p.ea-100 : p.ea, p]; visible.push(item);
      const score=Math.abs(dx)+(p.occ?HIDDEN_PENALTY:0);
      if (sel==null||score<best){ sel=item; best=score; }
    }
    // Silueta por capas
    const base=horizonY+3, x0=Math.trunc(w*0.05), step=(w-2*x0)/(COLS-1);
    LAYERS.forEach((Lr,L)=>{ const minD=Lr[0], maxD=L==0?1e9:LAYERS[L-1][0];
      const items=terrain.filter(t=>t[2]>minD&&t[2]<=maxD); if(!items.length) return;
      const pts=[]; let any=false;
      for(let c=0;c<COLS;c++){ const x=Math.trunc(x0+c*step), a=(x-cx)/ppd; let b=-90;
        for(const it of items){ const e=it[1]-Math.abs(a-it[0])*SLOPE; if(e>b)b=e; }
        let y=b<=-89?base:angleToY(b); if(y>base)y=base; if(y<base)any=true; pts.push([x,y]); }
      if(!any) return;
      dc.beginPath(); dc.moveTo(...pts[0]); pts.forEach(q=>dc.lineTo(...q)); dc.lineTo(pts[pts.length-1][0],base); dc.lineTo(pts[0][0],base); dc.closePath(); dc.fillStyle=Lr[1]; dc.fill();
      for(let c=1;c<pts.length;c++) if(pts[c-1][1]<base||pts[c][1]<base) line(pts[c-1][0],pts[c-1][1],pts[c][0],pts[c][1],Lr[2]);
    });
    visible.sort((a,b)=>b[1]-a[1]);
    const shown=[];
    for (let i=-1;i<visible.length && shown.length<MAX_LABELS;i++){
      const item=i<0?sel:visible[i]; if (i>=0 && item===sel) continue;
      const row=item[2], x=cx+Math.trunc(item[0]*ppd), markerY=angleToY(row.ea);
      const name=fit(row.name,XTINY,w*0.30), half=(tw(name,XTINY)+1)/2;
      let label;
      for (let r=0;r<rowCount;r++) {
        const y=firstLabelY+r*(FH_XTINY+3), halfRow=Math.trunc(usable(y)/2);
        const lx=clamp(x,cx-halfRow+half,cx+halfRow-half);
        if (shown.some(other=>other.y===y && Math.abs(lx-other.x)<half+other.half+6)) continue;
        label={x:lx,y,half,name,color:item===sel?C.accent:(row.occ?C.muted:C.ice)};
        break;
      }
      if (!label) continue;
      shown.push(label);
      const lc=item===sel?C.accent:(row.occ?C.grid:C.muted);
      line(label.x,label.y+FH_XTINY,x,markerY-7,lc);
      tri([[x,markerY-6],[x-5,markerY+3],[x+5,markerY+3]],lc,!row.occ);
    }
    for (const label of shown) {
      dc.fillStyle=C.sky;
      dc.fillRect(label.x-label.half-2,label.y,label.half*2+4,FH_XTINY);
      text(label.x,label.y,XTINY,label.color,label.name);
    }
    const p=sel[2];
    selectedOccluded=!!p.occ;
    text(cx,infoY,TINY,p.occ?C.muted:C.accent,fit(p.name,TINY,usable(infoY,FH_TINY)));
    const dist=p.d<1000?Math.trunc(p.d)+' m'
      :p.d<10000?(Math.round(p.d/100)/10).toFixed(1).replace('.',',')+' km':Math.trunc(p.d/1000)+' km';
    const alt=Math.trunc(p.ele)+' m', y2=infoY+FH_TINY;
    const icon=Math.trunc(FH_XTINY*0.45), gap=Math.trunc(icon*0.5), half=Math.trunc(icon/2);
    const aw=tw(alt,XTINY), dw=tw(dist,XTINY), arrow=Math.trunc(icon*1.6);
    const total=icon+gap+aw+icon*2+arrow+gap+dw;
    if (total>usable(y2)) {
      text(cx,y2,XTINY,C.ice,fit(alt+'  ·  '+dist,XTINY,usable(y2)));
    } else {
      let x=cx-total/2;
      const midY=y2+FH_XTINY/2, teal='#80BBC7';
      tri([[x,midY+half],[x+half,midY-half],[x+icon,midY+half]],teal,true);
      x+=icon+gap;
      dc.textAlign='left'; text(x,y2,XTINY,C.ice,alt); x+=aw+icon*2;
      dc.fillStyle=teal; dc.fillRect(x+half,midY-1,arrow-icon,3);
      tri([[x,midY],[x+half,midY-half],[x+half,midY+half]],teal,true);
      tri([[x+arrow,midY],[x+arrow-half,midY-half],[x+arrow-half,midY+half]],teal,true);
      x+=arrow+gap; text(x,y2,XTINY,C.ice,dist); dc.textAlign='center';
    }
  }
  let foot=s.foot||(selectedOccluded?'Posible oclusión':'© OpenStreetMap');
  if (foot==='© OpenStreetMap' && tw(foot,XTINY)>usable(footY)) foot='© OSM';
  text(cx,footY,XTINY,C.muted,fit(foot,XTINY,usable(footY)));

  // Máscara circular de la pantalla AMOLED
  dc.globalCompositeOperation='destination-in'; dc.beginPath(); dc.arc(cx,h/2,h/2,0,Math.PI*2); dc.fill();
  dc.globalCompositeOperation='destination-over'; dc.fillStyle='#000'; dc.fillRect(0,0,w,h);
}
window.drawScene = drawScene;
</script></body></html>
